name: booking
version: "1.0.0"
category: booking
enabled: true

description: |
  创建旅游预订、获取预订状态。
  支持酒店、航班、景点门票等多种预订类型。

# 机器可读的输入参数定义（JSON Schema）
input_schema:
  type: object
  properties:
    booking_details:
      type: object
      description: "预订详情（创建预订时使用）"
      properties:
        type:
          type: string
          enum: ["hotel", "flight", "package", "activity"]
          description: "预订类型"
        destination:
          type: string
          description: "目的地"
        dates:
          type: object
          description: "日期信息"
          properties:
            check_in:
              type: string
              description: "入住日期（酒店）(YYYY-MM-DD)"
            check_out:
              type: string
              description: "退房日期（酒店）(YYYY-MM-DD)"
            departure:
              type: string
              description: "出发日期（航班）(YYYY-MM-DD)"
            return:
              type: string
              description: "返回日期（航班）(YYYY-MM-DD)"
        travelers:
          type: array
          description: "旅客信息"
          items:
            type: object
            properties:
              name:
                type: string
                description: "姓名"
              age:
                type: integer
                minimum: 0
                description: "年龄"
              document_type:
                type: string
                description: "证件类型"
              document_number:
                type: string
                description: "证件号码"
        contact:
          type: object
          description: "联系信息"
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
        payment:
          type: object
          description: "支付信息"
          properties:
            method:
              type: string
              description: "支付方式"
            amount:
              type: number
              minimum: 0
              description: "金额"
        product_id:
          type: string
          description: "产品ID（酒店、航班等）"
      required: ["type", "destination", "contact"]
    booking_id:
      type: string
      description: "预订ID（查询状态时使用）"
    action:
      type: string
      enum: ["create", "query", "cancel"]
      default: "create"
      description: "预订操作类型"
  # 根据 action 判断哪个字段是必需的

# 输出格式定义（JSON Schema）
output_schema:
  type: object
  properties:
    booking_id:
      type: string
      description: "预订ID"
    status:
      type: string
      enum: ["confirmed", "pending", "cancelled", "failed"]
      description: "预订状态"
    details:
      type: object
      description: "预订详情"
      additionalProperties: true
    message:
      type: string
      description: "状态消息"
    total_cost:
      type: number
      description: "总费用"
    confirmation_code:
      type: string
      description: "确认码"
    payment_status:
      type: string
      enum: ["paid", "pending", "failed"]
      description: "支付状态"
    cancellation_policy:
      type: string
      description: "取消政策"
    metadata:
      type: object
      description: "元数据"
  required: ["booking_id", "status"]

# 动态成本计算
cost:
  base: 0.03
  per_traveler: 0.02
  formula: "base + travelers_count * per_traveler"
  description: "基础费用加上每个旅客的费用"

# 性能指标
performance:
  avg_execution_time_ms: 600
  p95_execution_time_ms: 1500
  timeout_ms: 8000

# 依赖管理
dependencies:
  - name: "info_collection"
    optional: false
    description: "需要收集用户信息"
  - name: "search"
    optional: false
    description: "需要基于搜索结果预订"

# LLM 使用提示
llm_hint: |
  当用户需要预订酒店、航班或旅游产品时使用此 skill。
  确保已收集完整的用户信息（旅客详情、联系方式）。
  先搜索确认产品可用性再执行预订。
  明确告知用户预订条款和取消政策。

# 使用示例
examples:
  - input:
      action: "create"
      booking_details:
        type: "hotel"
        destination: "巴黎"
        product_id: "hotel_paris_001"
        dates:
          check_in: "2024-06-01"
          check_out: "2024-06-05"
        travelers:
          - name: "张三"
            age: 30
            document_type: "passport"
            document_number: "E12345678"
          - name: "李四"
            age: 28
            document_type: "passport"
            document_number: "E87654321"
        contact:
          email: "zhangsan@example.com"
          phone: "+86-138-0000-0000"
        payment:
          method: "credit_card"
          amount: 3200
    output:
      booking_id: "BK20240601001"
      status: "confirmed"
      message: "预订成功！"
      total_cost: 3200
      confirmation_code: "CFM123456"
      payment_status: "paid"
      cancellation_policy: "免费取消至 2024-05-25"
      details:
        hotel:
          name: "巴黎大酒店"
          address: "1 Rue Example, Paris"
          room_type: "Deluxe Double"
          nights: 4
      metadata: {}
