server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: gateway

  main:
    web-application-type: reactive

  ai:
    mcp:
      server:
        enabled: true
        name: travel-gateway-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: ASYNC
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
  config:
    import: optional:nacos:${spring.application.name}.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

mcp:
  tools:
    search-hotels:
      name: search_hotels
      description: 搜索酒店，支持目的地、日期、价格和评分过滤
      service: hotel-service
      path: /api/hotel/search
      method: GET
      enabled: true
    search-flights:
      name: search_flights
      description: 搜索航班，支持航线、日期、价格和航空公司过滤
      service: flight-service
      path: /api/flight/flight_info
      method: POST
      enabled: true
    search-attractions:
      name: search_attractions
      description: 搜索景点，支持目的地、分类、评分和标签过滤
      service: attraction-service
      path: /api/attraction/search
      method: GET
      enabled: true
    get-hotel-details:
      name: get_hotel_details
      description: 获取酒店详细信息
      service: hotel-service
      path: /api/hotel/{id}
      method: GET
      enabled: true
    get-flight-details:
      name: get_flight_details
      description: 获取航班详细信息
      service: flight-service
      path: /api/flight/{id}
      method: GET
      enabled: true
    get-attraction-details:
      name: get_attraction_details
      description: 获取景点详细信息
      service: attraction-service
      path: /api/attraction/{id}
      method: GET
      enabled: true
    create-booking:
      name: create_booking
      description: 创建酒店、航班或景点预订
      service: booking-service
      path: /api/booking
      method: POST
      enabled: true
    get-booking-status:
      name: get_booking_status
      description: 获取预订状态和详情
      service: booking-service
      path: /api/booking/{id}
      method: GET
      enabled: true
    get-recommendations:
      name: get_recommendations
      description: 获取个性化推荐
      service: recommendation-service
      path: /api/recommendation/comprehensive/{userId}
      method: GET
      enabled: true

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # Auth Service - 无需认证（公开路由）
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
        
        # User Service - 需要认证
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0
        
        # Flight Service - 需要认证
        - id: flight-service
          uri: lb://flight-service
          predicates:
            - Path=/api/flight/**
          filters:
            - StripPrefix=0

        # Hotel Service - 需要认证
        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotel/**
          filters:
            - StripPrefix=0

        # Attraction Service - 需要认证
        - id: attraction-service
          uri: lb://attraction-service
          predicates:
            - Path=/api/attraction/**
          filters:
            - StripPrefix=0

        # Booking Service - 需要认证
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/**
          filters:
            - StripPrefix=0

        # Recommendation Service - 需要认证
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendation/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8080
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.travelassistant.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: DEBUG
    io.modelcontextprotocol.server: DEBUG
    org.springframework.ai.mcp.server: DEBUG
