version: '3.8'

services:
  # Nacos 配置中心和服务注册中心
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos
    ports:
      - "8848:8848"
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=postgres
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_PORT=5432
      - MYSQL_SERVICE_USER=postgres
      - MYSQL_SERVICE_PASSWORD=password
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    volumes:
      - nacos-data:/home/nacos/data
    depends_on:
      - postgres
    networks:
      - travel-assistant-network

  # PostgreSQL 数据库
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=travel_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/init-sample-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    networks:
      - travel-assistant-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - travel-assistant-network

  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - NACOS_ADDR=nacos:8848
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
    networks:
      - travel-assistant-network

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8083:8083"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_HOST=postgres
      - DB_NAME=user_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
      - postgres
    networks:
      - travel-assistant-network

  # Hotel Service
  hotel-service:
    build:
      context: ./hotel-service
      dockerfile: Dockerfile
    container_name: hotel-service
    ports:
      - "8081:8081"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_HOST=postgres
      - DB_NAME=hotel_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
      - postgres
    networks:
      - travel-assistant-network

  # Flight Service
  flight-service:
    build:
      context: ./flight-service
      dockerfile: Dockerfile
    container_name: flight-service
    ports:
      - "8082:8082"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_HOST=postgres
      - DB_NAME=flight_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
      - postgres
    networks:
      - travel-assistant-network

  # Attraction Service
  attraction-service:
    build:
      context: ./attraction-service
      dockerfile: Dockerfile
    container_name: attraction-service
    ports:
      - "8084:8084"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_HOST=postgres
      - DB_NAME=attraction_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
      - postgres
    networks:
      - travel-assistant-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Booking Service
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "8085:8085"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_HOST=postgres
      - DB_NAME=booking_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
      - postgres
    networks:
      - travel-assistant-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Recommendation Service
  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation-service
    ports:
      - "8086:8086"
    environment:
      - NACOS_ADDR=nacos:8848
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
    networks:
      - travel-assistant-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Travel Assistant Agent
  travel-assistant-agent:
    build:
      context: ../travel-assistant-agent
      dockerfile: Dockerfile
    container_name: travel-assistant-agent
    ports:
      - "8000:8000"
    environment:
      - API_BASE_URL=http://gateway:8080
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - gateway
    networks:
      - travel-assistant-network

volumes:
  postgres-data:
  nacos-data:
  redis-data:

networks:
  travel-assistant-network:
    driver: bridge