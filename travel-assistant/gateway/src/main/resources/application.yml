server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway

  main:
    web-application-type: reactive

  config:
    import: optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**

        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotel/**

        - id: flight-service
          uri: lb://flight-service
          predicates:
            - Path=/api/flight/**

        - id: attraction-service
          uri: lb://attraction-service
          predicates:
            - Path=/api/attraction/**

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/**

        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendation/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info
