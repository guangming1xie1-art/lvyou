name: info_collection
version: "1.0.0"
category: info
enabled: true

description: |
  与用户交互收集旅游需求信息。
  智能提取目的地、日期、预算、偏好等关键信息，并识别缺失字段。

# 机器可读的输入参数定义（JSON Schema）
input_schema:
  type: object
  properties:
    user_message:
      type: string
      description: "用户消息（自然语言）"
      minLength: 1
    context:
      type: object
      description: "上下文信息"
      properties:
        conversation_history:
          type: array
          description: "对话历史"
          items:
            type: object
            properties:
              role:
                type: string
                enum: ["user", "assistant"]
              content:
                type: string
        previous_collected_info:
          type: object
          description: "之前收集到的信息"
          additionalProperties: true
  required: ["user_message"]

# 输出格式定义（JSON Schema）
output_schema:
  type: object
  properties:
    collected_info:
      type: object
      description: "收集到的信息"
      properties:
        destination:
          type: string
          description: "目的地"
        dates:
          type: object
          description: "日期信息"
          properties:
            departure:
              type: string
              description: "出发日期 (YYYY-MM-DD)"
            return:
              type: string
              description: "返回日期 (YYYY-MM-DD)"
            check_in:
              type: string
              description: "入住日期 (YYYY-MM-DD)"
            check_out:
              type: string
              description: "退房日期 (YYYY-MM-DD)"
        budget:
          type: object
          description: "预算信息"
          properties:
            min:
              type: number
              minimum: 0
            max:
              type: number
              minimum: 0
            currency:
              type: string
              default: "CNY"
        travelers_count:
          type: integer
          description: "旅行人数"
          minimum: 1
          default: 1
        travelers_details:
          type: array
          description: "旅客详情"
          items:
            type: object
            properties:
              name:
                type: string
              age:
                type: integer
              document_type:
                type: string
              document_number:
                type: string
        preferences:
          type: array
          description: "用户偏好"
          items:
            type: string
        accommodation_type:
          type: string
          description: "住宿偏好"
          enum: ["hotel", "hostel", "apartment", "resort", "villa"]
        special_requirements:
          type: array
          description: "特殊要求"
          items:
            type: string
    missing_fields:
      type: array
      description: "缺失的字段列表"
      items:
        type: object
        properties:
          field:
            type: string
            description: "字段名"
          description:
            type: string
            description: "字段描述"
          required_for:
            type: string
            description: "用于什么场景"
    confidence:
      type: number
      description: "信息提取置信度（0-1）"
      minimum: 0
      maximum: 1
    suggestions:
      type: array
      description: "智能建议"
      items:
        type: string
    needs_clarification:
      type: boolean
      description: "是否需要用户澄清"
    clarification_questions:
      type: array
      description: "澄清问题列表"
      items:
        type: string
    metadata:
      type: object
      description: "元数据"
      properties:
        extraction_method:
          type: string
          description: "提取方法"
        execution_time_ms:
          type: integer
          description: "执行时间毫秒"
  required: ["collected_info", "confidence"]

# 动态成本计算
cost:
  base: 0.01
  per_field: 0.002
  formula: "base + num_extracted_fields * per_field"
  description: "基础费用加上每个提取字段的费用"

# 性能指标
performance:
  avg_execution_time_ms: 300
  p95_execution_time_ms: 800
  timeout_ms: 5000

# 依赖管理
dependencies: []

# LLM 使用提示
llm_hint: |
  当需要了解用户旅游需求时使用此 skill。
  分析用户输入提取目的地、日期、预算、偏好等信息。
  识别缺失的关键信息并主动询问用户补充。
  此 skill 应优先执行，为其他 skills 收集基础数据。

# 使用示例（用于 LLM few-shot）
examples:
  - input:
      user_message: "我想去巴黎旅游，预算1万到1万5，两个人，9月中旬出发一周左右"
      context:
        conversation_history: []
        previous_collected_info: {}
    output:
      collected_info:
        destination: "巴黎"
        budget:
          min: 10000
          max: 15000
          currency: "CNY"
        travelers_count: 2
        dates:
          departure: "2024-09-15"
          return: "2024-09-22"
        preferences: []
      missing_fields:
        - field: "accommodation_type"
          description: "需要了解住宿偏好"
          required_for: "search"
      confidence: 0.85
      suggestions:
        - "9月是巴黎旅游旺季，建议提前预订"
        - "考虑购买旅游保险"
      needs_clarification: true
      clarification_questions:
        - "您对酒店有什么偏好吗？比如星级、位置等"
        - "行程中有什么特别想体验的嘛？"
      metadata:
        extraction_method: "llm"
        execution_time_ms: 250
  - input:
      user_message: "我已经确定要去东京，2024年10月1日出发，5号回来，预算8000到10000元"
      context:
        conversation_history: []
        previous_collected_info: {}
    output:
      collected_info:
        destination: "东京"
        dates:
          departure: "2024-10-01"
          return: "2024-10-05"
        budget:
          min: 8000
          max: 10000
          currency: "CNY"
        travelers_count: 1
        preferences: []
      missing_fields: []
      confidence: 0.92
      suggestions:
        - "10月初是东京旅游好时节"
        - "可以考虑预订浅草寺附近的酒店"
      needs_clarification: false
      clarification_questions: []
