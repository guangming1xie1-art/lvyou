server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service

#  datasource:
#    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_assistant?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
#    username: ${SPRING_DATASOURCE_USERNAME:root}
#    password: ${SPRING_DATASOURCE_PASSWORD:password}
#    driver-class-name: com.mysql.cj.jdbc.Driver
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lvyou_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate  # 使用migration文件，不自动建表
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  config:
    import: optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET_KEY:your-super-secret-key-change-in-production-32bytes}
  algorithm: HS256
  accessTokenExpiration: 900000    # 15分钟（毫秒）
  refreshTokenExpiration: 604800000 # 7天（毫秒）
