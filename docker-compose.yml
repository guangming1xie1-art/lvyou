version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: travel-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - travel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: travel-assistant-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=travel_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - travel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 3

  agent:
    build:
      context: ./travel-assistant-agent
      dockerfile: Dockerfile
    container_name: travel-assistant-agent
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=travel_assistant
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - ENABLE_GZIP=true
    depends_on:
      - redis
      - postgres
    networks:
      - travel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./travel-assistant-front
      dockerfile: Dockerfile
    container_name: travel-assistant-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - VITE_AGENT_API_BASE_URL=http://agent:8000
    depends_on:
      - agent
    networks:
      - travel-network
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:

networks:
  travel-network:
    driver: bridge
    name: travel-network
