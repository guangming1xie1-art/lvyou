name: recommend
version: "1.0.0"
category: recommend
enabled: true

description: |
  基于用户偏好和搜索结果生成个性化旅游推荐方案。
  综合考虑预算、时间、偏好等因素，生成多个可选方案。

# 机器可读的输入参数定义（JSON Schema）
input_schema:
  type: object
  properties:
    user_prefs:
      type: object
      description: "用户偏好信息"
      properties:
        budget:
          type: object
          description: "预算范围"
          properties:
            min:
              type: number
              minimum: 0
            max:
              type: number
              minimum: 0
            currency:
              type: string
              default: "CNY"
        dates:
          type: object
          description: "旅行日期"
          properties:
            departure:
              type: string
              description: "出发日期 (YYYY-MM-DD)"
            return:
              type: string
              description: "返回日期 (YYYY-MM-DD)"
        travelers_count:
          type: integer
          description: "旅行人数"
          minimum: 1
          default: 1
        preferences:
          type: array
          description: "偏好标签"
          items:
            type: string
        accommodation_type:
          type: string
          description: "住宿类型"
          enum: ["hotel", "hostel", "apartment", "resort"]
        pace:
          type: string
          description: "行程节奏"
          enum: ["relaxed", "moderate", "packed"]
      required: ["budget", "dates"]
    search_results:
      type: array
      description: "搜索结果列表（来自 search skill）"
      items:
        type: object
    num_recommendations:
      type: integer
      description: "生成推荐数量"
      default: 3
      minimum: 1
      maximum: 10
  required: ["user_prefs"]

# 输出格式定义（JSON Schema）
output_schema:
  type: object
  properties:
    recommendations:
      type: array
      description: "推荐方案列表"
      items:
        type: object
        properties:
          id:
            type: string
            description: "推荐ID"
          title:
            type: string
            description: "推荐标题"
          description:
            type: string
            description: "推荐描述"
          confidence:
            type: number
            description: "置信度（0-1）"
            minimum: 0
            maximum: 1
          total_cost:
            type: object
            description: "总费用"
            properties:
              amount:
                type: number
                description: "金额"
              currency:
                type: string
                description: "货币代码"
              breakdown:
                type: object
                description: "费用明细"
                additionalProperties: true
          itinerary:
            type: array
            description: "行程列表"
            items:
              type: object
              properties:
                day:
                  type: integer
                  description: "天数"
                title:
                  type: string
                  description: "当天标题"
                activities:
                  type: array
                  description: "活动列表"
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                        description: "时间"
                      activity:
                        type: string
                        description: "活动内容"
                      location:
                        type: string
                        description: "地点"
                      duration:
                        type: string
                        description: "持续时间"
                        nullable: true
          highlights:
            type: array
            description: "亮点标签"
            items:
              type: string
          estimated_duration_days:
            type: integer
            description: "预计天数"
    selected_recommendation_id:
      type: string
      description: "选中的推荐ID（如有）"
      nullable: true
  required: ["recommendations"]

# 动态成本计算
cost:
  base: 0.02
  per_recommendation: 0.02
  formula: "base + min(num_recommendations, 5) * per_recommendation"
  description: "基础费用加上每个推荐方案的费用"

# 性能指标
performance:
  avg_execution_time_ms: 800
  p95_execution_time_ms: 2000
  timeout_ms: 10000

# 依赖管理
dependencies:
  - name: "info_collection"
    optional: false
    description: "需要先收集用户信息"
  - name: "search"
    optional: false
    description: "需要搜索结果作为基础数据"

# LLM 使用提示
llm_hint: |
  当需要为用户生成个性化旅游方案时使用此 skill。
  确保已收集足够用户信息（预算、日期、偏好等）。
  优先考虑搜索结果中的可用选项。
  生成 2-5 个不同风格的推荐方案供用户选择。

# 使用示例（用于 LLM few-shot）
examples:
  - input:
      user_prefs:
        budget:
          min: 10000
          max: 15000
          currency: "CNY"
        dates:
          departure: "2024-09-15"
          return: "2024-09-22"
        travelers_count: 2
        preferences: ["文化", "美食", "历史"]
        accommodation_type: "hotel"
        pace: "moderate"
      search_results:
        - id: "dest_paris_001"
          name: "巴黎"
          description: "浪漫之都"
          rating: 4.8
        - id: "dest_rome_001"
          name: "罗马"
          description: "永恒之城"
          rating: 4.7
      num_recommendations: 3
    output:
      recommendations:
        - id: "rec_001"
          title: "经典巴黎 7 日游"
          description: "探索浪漫之都的经典景点和美食"
          confidence: 0.85
          total_cost:
            amount: 12000
            currency: "CNY"
            breakdown:
              flights: 4000
              accommodation: 3500
              activities: 2500
              meals: 2000
          itinerary:
            - day: 1
              title: "抵达巴黎"
              activities:
                - time: "14:00"
                  activity: "入住酒店"
                  location: "市中心酒店"
                  duration: "1h"
                - time: "16:00"
                  activity: "香榭丽舍漫步"
                  location: "香榭丽舍大街"
                  duration: "2h"
          highlights: ["埃菲尔铁塔", "卢浮宫", "法式大餐"]
          estimated_duration_days: 7
        - id: "rec_002"
          title: "罗马深度游"
          description: "穿越历史的长河，体验古罗马文明"
          confidence: 0.78
          total_cost:
            amount: 11000
            currency: "CNY"
            breakdown:
              flights: 3800
              accommodation: 3200
              activities: 2200
              meals: 1800
          itinerary:
            - day: 1
              title: "抵达罗马"
              activities:
                - time: "15:00"
                  activity: "入住酒店"
                  location: "古罗马区酒店"
                  duration: "1h"
          highlights: ["斗兽场", "梵蒂冈", "意大利美食"]
          estimated_duration_days: 7
      selected_recommendation_id: null
  - input:
      user_prefs:
        budget:
          min: 5000
          max: 8000
          currency: "CNY"
        dates:
          departure: "2024-08-01"
          return: "2024-08-04"
        travelers_count: 1
        preferences: ["海滩", "放松"]
        accommodation_type: "resort"
        pace: "relaxed"
      search_results:
        - id: "dest_bali_001"
          name: "巴厘岛"
          description: "热带天堂"
          rating: 4.6
      num_recommendations: 2
    output:
      recommendations:
        - id: "rec_001"
          title: "巴厘岛奢华度假"
          description: "享受阳光沙滩和豪华度假村"
          confidence: 0.92
          total_cost:
            amount: 6500
            currency: "CNY"
            breakdown:
              flights: 2800
              accommodation: 2500
              activities: 800
              meals: 400
          highlights: ["海滩", "SPA", "日落"]
          estimated_duration_days: 3
      selected_recommendation_id: null
