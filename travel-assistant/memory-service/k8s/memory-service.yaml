apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-service-config
  namespace: travel-assistant
data:
  application.yml: |
    server:
      port: 8088
      servlet:
        context-path: /api/memory

    spring:
      application:
        name: memory-service
      
      datasource:
        url: jdbc:postgresql://postgres-service:5432/travel_assistant
        username: postgres
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
      
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false

    logging:
      level:
        root: INFO
        com.travelassistant.memory: INFO

---
apiVersion: v1
kind: Secret
metadata:
  name: memory-service-secret
  namespace: travel-assistant
type: Opaque
data:
  db-password: eW91cl9wYXNzd29yZA==  # base64 encoded

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: travel-assistant
  labels:
    app: memory-service
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
        version: v1.0.0
    spec:
      containers:
      - name: memory-service
        image: travel-assistant/memory-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8088
          name: http
          protocol: TCP
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: memory-service-secret
              key: db-password
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        configMap:
          name: memory-service-config

---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: travel-assistant
  labels:
    app: memory-service
spec:
  type: ClusterIP
  ports:
  - port: 8088
    targetPort: 8088
    protocol: TCP
    name: http
  selector:
    app: memory-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-service-hpa
  namespace: travel-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memory-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
